name = "amc-relay"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# helpers.js signs and hashes with node:crypto, which this flag provides.
compatibility_flags = ["nodejs_compat"]

# The PWA. The catch-all route in worker/index.js hands anything that is not
# /api/* to this binding, so client-side routes such as /runs/<id> still land
# on index.html.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "amc-relay"
database_id = "bddc397e-d8d1-4383-bebf-b2eab4b49a1a"

[vars]
# Secrets (DESKTOP_API_TOKEN, VAPID_PRIVATE_KEY, FCM_SERVICE_ACCOUNT_JSON) are
# set with `wrangler secret put`, never here. FCM_SERVICE_ACCOUNT_JSON is the
# Firebase service account key (JSON or base64 of it) for release pushes.
PUBLIC_BASE_URL = ""
